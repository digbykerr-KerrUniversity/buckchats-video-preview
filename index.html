<html lang="en">
  <head>
    <meta charset="utf-8">

    <meta property="og:url" content="https://digbykerr-kerruniversity.github.io/buckchats-video-preview/">
    <meta property="og:image" content="https://digbykerr-kerruniversity.github.io/buckchats-video-preview/poster.jpg">
    <meta property="og:image:secure_url" content="https://digbykerr-kerruniversity.github.io/buckchats-video-preview/poster.jpg">

    <meta property="og:image:width" content="1920">

    <meta property="og:image:alt" content="BuckChats — Coming Soon — Join the community">
    <meta property="og:video" content="https://digbykerr-kerruniversity.github.io/buckchats-video-preview/buckchats-screens-demo.mp4">
    <meta property="og:video:secure_url" content="https://digbykerr-kerruniversity.github.io/buckchats-video-preview/buckchats-screens-demo.mp4">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BuckChats">
    <meta name="twitter:description" content="Live. Play. Connect. Grow. Meet BuckChats — coming soon.">
    <meta name="twitter:image" content="https://digbykerr-kerruniversity.github.io/buckchats-video-preview/poster.jpg">

    <style>
      :root { color-scheme: dark; font-family: Avenir Next, Avenir, Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: radial-gradient(circle at 50% 0%, #172e44 0, #09121c 44%, #03070b 100%); color: #f4fbff; }
      main { width: min(100%, 1060px); margin: 0 auto; padding: 26px 18px 42px; }
      .brand { text-align: center; margin: 2px 0 20px; }
      .brand img { width: min(74vw, 410px); height: auto; }
      .player { overflow: hidden; border: 1px solid rgba(97, 226, 255, .35); border-radius: 18px; background: #000; box-shadow: 0 22px 70px rgba(0, 0, 0, .55); }
      video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
      .copy { text-align: center; padding: 24px 12px 0; }
      h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); letter-spacing: -.03em; }
      p { margin: 10px auto 22px; color: #bed4e3; font-size: clamp(17px, 3vw, 21px); }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .button { appearance: none; border: 0; border-radius: 999px; padding: 14px 22px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .primary { color: #06111a; background: linear-gradient(90deg, #67e4ff, #a78cff); }
      .secondary { color: #eaf8ff; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16); }
      .site { margin-top: 20px; font-size: 15px; }
      .site a { color: #83e9ff; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="brand-wordmark.png" alt="BuckChats"></div>
      <section class="player" aria-label="BuckChats introduction video">
        <video controls playsinline preload="metadata" poster="poster.jpg">
          <source src="buckchats-screens-demo.mp4" type="video/mp4">
          <track kind="captions" srclang="en" label="English" src="captions.vtt" default>
          Your browser does not support this video. Use the download link below.
        </video>
      </section>
      <section class="copy">
        <h1>Coming soon</h1>
        <p>Live. Play. Connect. Grow. Join the BuckChats community.</p>
        <div class="actions">
          <button class="button primary" id="share" type="button">Share BuckChats</button>
          <a class="button secondary" href="buckchats-screens-demo.mp4" download>Download video</a>
        </div>
        <div class="site"><a href="https://buckchats.com">buckchats.com</a></div>
      </section>
    </main>
    <script>
      document.getElementById('share').addEventListener('click', async () => {
        const data = { title: 'BuckChats', text: 'Meet BuckChats — coming soon.', url: location.href };
        if (navigator.share) {
          try { await navigator.share(data); } catch (error) { if (error.name !== 'AbortError') throw error; }
        } else {
          await navigator.clipboard.writeText(location.href);
          document.getElementById('share').textContent = 'Link copied';
        }
      });
    </script>
  </body>
</html>
